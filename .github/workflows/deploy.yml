name: Deploy IoT System (Distributed - Local Simulator)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Deploy to Separate Servers
        run: |

          ssh-keyscan -H ${{ secrets.BACKEND_API_IP }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.MQTT_BROKER_IP }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.POSTGRES_IP }} >> ~/.ssh/known_hosts

          # ---  1: (PostgreSQL) ---
          echo "Restarting PostgreSQL..."
          ssh "dburan@edu.cdv.pl"@${{ secrets.POSTGRES_IP }} "sudo systemctl restart postgresql"

          # ---  2:  (MQTT Mosquitto) ---
          echo "Restarting MQTT Broker..."
          ssh "dburan@edu.cdv.pl"@${{ secrets.MQTT_BROKER_IP }} "sudo systemctl restart mosquitto"

          # ---  3: BACKEND API ---
          echo "Updating Backend..."
          ssh -v "dburan@edu.cdv.pl"@${{ secrets.BACKEND_API_IP }} << 'EOF'
            if [ ! -d "IoT-Fire-Detection-and-Safety-System-" ]; then
              git clone https://github.com/anakataa/IoT-Fire-Detection-and-Safety-System-.git
            fi
            cd IoT-Fire-Detection-and-Safety-System-
            
            git pull origin main

            
            
            sudo docker-compose up -d --build backend

            # Очистка старых данных
            sudo docker image prune -f
          EOF

