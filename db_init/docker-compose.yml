version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: iot_db
    restart: always
    environment:
      POSTGRES_DB: iot_data
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iotpass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pg_data:
